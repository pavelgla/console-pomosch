# Подписанная iOS/iPadOS-сборка «Консоль Помощь» → TestFlight.
#
# Единственное место с шагами iOS-сборки: тег-сборка (flutter-build.yml) зовёт этот же
# workflow, а не держит копию — иначе ручной прогон и релизный разъедутся по подписи.
#
# Два входа:
#   workflow_dispatch — ручной прогон одной iOS-джобы (полный прогон форка идёт ~час,
#                       итерации по подписи так вести нельзя); мост генерится здесь же;
#   workflow_call     — вызов из flutter-build.yml, где мост уже собран джобой generate-bridge.
#
# Секреты (см. решение 14 спеки helpdesk): APPSTORE_API_KEY_P8, APPSTORE_KEY_ID,
# APPSTORE_ISSUER_ID, APPSTORE_TEAM_ID, APPLE_DIST_CERT_P12, APPLE_DIST_CERT_PASSWORD.
# Без них джоба не краснеет, а собирает неподписанный билд: форк публичный, и он обязан
# собираться у любого, кто его клонировал.
name: iOS build (signed)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (пусто — номер прогона)"
        required: false
        type: string
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      build_number:
        required: false
        type: string

# ВАЖНО: реюзабельный workflow не наследует env вызывающего, а `env` нельзя подставить
# в `with:` — поэтому версии продублированы из flutter-build.yml. Совпадение проверяется
# тестом helpdesk tests/t70-ios-signing.sh; при бампе версий править оба файла.
env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # Мост нужен только ручному прогону: при вызове из flutter-build.yml он уже собран,
  # и артефакт bridge-artifact лежит в том же run.
  generate-bridge:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bridge.yml

  build:
    needs: [generate-bridge]
    if: always() && (needs.generate-bridge.result == 'success' || needs.generate-bridge.result == 'skipped')
    name: build consolehelp ios ipa
    runs-on: macos-latest
    env:
      APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
      APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
      APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
      # Xcode 26 + SwiftPM: `xcodebuild -showBuildSettings` бывает медленным, дефолтный
      # таймаут fastlane 3с×4 флачит (грабля conv42).
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # Apple требует сборку свежим iOS SDK для заливки в App Store Connect; дефолтный
      # Xcode на раннере бывает старее. Версию закрепляем явно, а не полагаемся на образ.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-ios \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: aarch64-apple-ios

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      # --- Путь с подписью (есть ключ App Store Connect) → TestFlight ---------------------
      # Сначала flutter-сборка без подписи: она генерит Generated.xcconfig и ставит CocoaPods.
      # Номер билда берём из номера прогона: pubspec.yaml статичен (1.4.8+66), а ASC отклоняет
      # повторную заливку билда с тем же CFBundleVersion.
      - name: Build iOS (codesigned → TestFlight)
        if: env.APPSTORE_API_KEY_P8 != ''
        shell: bash
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "$APPSTORE_API_KEY_P8" | base64 -d > "$ASC_KEY_PATH"
          export DIST_CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo "$APPLE_DIST_CERT_P12" | base64 -d > "$DIST_CERT_PATH"
          pushd flutter
          flutter build ios --release --no-codesign --build-number=${{ inputs.build_number || github.run_number }}
          cd ios && fastlane beta

      - name: Upload signed .ipa
        if: env.APPSTORE_API_KEY_P8 != '' && hashFiles('flutter/build/ios-ipa/consolehelp.ipa') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consolehelp-ios-ipa
          path: flutter/build/ios-ipa/consolehelp.ipa

      # --- Фолбэк без секретов: неподписанная сборка (доказывает, что код компилируется) ---
      - name: Build iOS (unsigned)
        if: env.APPSTORE_API_KEY_P8 == ''
        shell: bash
        run: |
          pushd flutter
          flutter build ipa --release --no-codesign

      - name: Upload unsigned build
        if: env.APPSTORE_API_KEY_P8 == ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consolehelp-ios-unsigned
          path: flutter/build/ios/iphoneos/Runner.app
