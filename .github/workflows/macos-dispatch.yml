name: macOS signing dry run

# Итерации подписи и нотаризации macOS без сборки остальных платформ и без публикации:
# подписанный dmg уходит артефактом, смоук гоняется на раннере (w-all-platforms).
on:
  workflow_dispatch:
  push:  # ВРЕМЕННО на итерации волны: dispatch нового файла с ветки GitHub не принимает
    branches: [w-all-platforms]

jobs:
  run-macos-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: false
      macos-only: true
      require-signing: true
