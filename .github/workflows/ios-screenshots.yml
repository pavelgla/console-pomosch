# Съёмка скриншотов для карточки App Store с iOS-симулятора (iPhone 6.9″ и iPad 13″).
#
# Только для съёмки: на релизные сборки и TestFlight не влияет, ничего не подписывает и не
# публикует. Собирает отладочную симуляторную сборку (rust-библиотека без hwcodec — для кадров
# аппаратный кодек не нужен), гоняет flutter/integration_test/screenshots_test.dart, а кадры
# снимает хост через `xcrun simctl io screenshot` (так в кадре настоящий статус-бар).
#
# Секреты: SHOTS_ACCOUNT_USER / SHOTS_ACCOUNT_PASS (демо-учётка api.console10.ru),
# SHOTS_PEER_PASS (пароль демо-стенда, ID 361107164). Значения маскируются и не печатаются.
name: iOS screenshots (simulator)

on:
  workflow_dispatch:
  # Пока воркфлоу не на дефолтной ветке, GitHub не даёт его запустить вручную — гоним пушем в ветку съёмки.
  push:
    branches: [ci-ios-screenshots]

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  shots:
    needs: [generate-bridge]
    name: screenshots ios simulator
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      SHOTS_USER: ${{ secrets.SHOTS_ACCOUNT_USER }}
      SHOTS_PASS: ${{ secrets.SHOTS_ACCOUNT_PASS }}
      SHOTS_PEER_PASS: ${{ secrets.SHOTS_PEER_PASS }}
    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::$SHOTS_PASS"
          echo "::add-mask::$SHOTS_PEER_PASS"

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (arm64-ios-simulator)
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install \
            --triplet arm64-ios-simulator \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi
          # build.rs scrap ищет библиотеки по `<arch>-<os>` = arm64-ios; симуляторный набор кладём под это имя.
          # Порт libvpx (configure) собирает объекты с меткой платформы «iOS» даже под триплет симулятора, и ld
          # отказывается их линковать. Пересобираем libvpx той же версии (1.15.2) напрямую под симулятор.
          # generic-gnu: без NEON-ассемблера, для съёмки скорость декодера не важна.
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          T="-target arm64-apple-ios14.0-simulator -isysroot $SDK"
          git clone -q --depth 1 --branch v1.15.2 https://github.com/webmproject/libvpx.git "$RUNNER_TEMP/libvpx-src"
          mkdir "$RUNNER_TEMP/vpxb" && cd "$RUNNER_TEMP/vpxb"
          CC="clang $T" CXX="clang++ $T" LD="clang $T" AS="clang $T" \
            "$RUNNER_TEMP/libvpx-src/configure" --target=generic-gnu --disable-examples --disable-tools \
            --disable-docs --disable-unit-tests --enable-pic --enable-static --disable-shared > cfg.log 2>&1 \
            || { tail -40 cfg.log; tail -40 config.log; exit 1; }
          make -j6 > mk.log 2>&1 || { tail -40 mk.log; exit 1; }
          cp libvpx.a "$VCPKG_ROOT/installed/arm64-ios-simulator/lib/libvpx.a"
          cd "$GITHUB_WORKSPACE"
          ln -sfn "$VCPKG_ROOT/installed/arm64-ios-simulator" "$VCPKG_ROOT/installed/arm64-ios"
          ls "$VCPKG_ROOT/installed"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios-sim
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios-sim
          key: aarch64-apple-ios-sim
          cache-on-failure: true

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Patch libsodium-sys for the simulator target
        run: |
          # libsodium-sys 0.2.7 не знает цель aarch64-apple-ios-sim (паникует «Unknown iOS build target»).
          # Правим скачанный исходник только в раннере: сборка как для устройства, но с SDK симулятора.
          cargo fetch --locked
          python3 - <<'PY'
          import glob
          arm = (
              '            "aarch64-apple-ios-sim" => {\n'
              '                cflags += " -arch arm64";\n'
              '                cflags += &format!(" -isysroot {}", sdk_dir_simulator);\n'
              '                cflags += &format!(" -mios-simulator-version-min={}", ios_simulator_version_min);\n'
              '                host_arg = "--host=arm-apple-darwin10".to_string();\n'
              '            }\n'
          )
          for p in glob.glob("/Users/runner/.cargo/registry/src/*/libsodium-sys-0.2.7/build.rs"):
              s = open(p).read()
              marker = '            "armv7-apple-ios" => {'
              assert marker in s
              open(p, "w").write(s.replace(marker, arm + marker, 1))
              print("пропатчен", p)
          PY

      - name: Build rustdesk lib (simulator)
        env:
          # bindgen-крейты (coreaudio-sys и др.) передают clang цель `aarch64-apple-ios-sim`, которую clang
          # не знает; последний --target побеждает.
          BINDGEN_EXTRA_CLANG_ARGS: "--target=arm64-apple-ios-simulator"
        run: |
          cargo build --locked --features flutter --release --target aarch64-apple-ios-sim --lib
          # Xcode-проект линкует путь устройства; не трогаем pbxproj, а кладём симуляторную библиотеку туда.
          mkdir -p target/aarch64-apple-ios/release
          cp target/aarch64-apple-ios-sim/release/liblibrustdesk.a target/aarch64-apple-ios/release/liblibrustdesk.a

      - name: Prepare Xcode project for simulator
        run: |
          cd flutter
          # Только в рабочей копии раннера: проект собирается лишь под iphoneos, симулятору нужна и вторая платформа.
          sed -i '' 's/SUPPORTED_PLATFORMS = iphoneos;/SUPPORTED_PLATFORMS = "iphoneos iphonesimulator";/' ios/Runner.xcodeproj/project.pbxproj
          # Статическая библиотека — только arm64.
          echo 'EXCLUDED_ARCHS[sdk=iphonesimulator*] = x86_64' >> ios/Flutter/Debug.xcconfig
          # integration_test (sdk) требует file 7, ffigen ^8 — file 6: ffigen нужен только для генерации
          # привязок, в съёмке не участвует. Правка pubspec — лишь в рабочей копии раннера.
          python3 -c "import re; s=open('pubspec.yaml').read(); s=re.sub(r'^  ffigen:.*\\n','',s,flags=re.M); s=s.replace('  flutter_test:\\n','  integration_test:\\n    sdk: flutter\\n  flutter_test:\\n',1); open('pubspec.yaml','w').write(s)"
          grep -n -B1 -A3 integration_test pubspec.yaml
          flutter pub get

      - name: Create simulators
        id: sims
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          def sh(*a): return subprocess.check_output(a, text=True)
          rts = [r for r in json.loads(sh("xcrun","simctl","list","runtimes","-j"))["runtimes"]
                 if r["platform"] == "iOS" and r.get("isAvailable")]
          rt = sorted(rts, key=lambda r: [int(x) for x in r["version"].split(".")])[-1]["identifier"]
          types = {t["name"]: t["identifier"] for t in json.loads(sh("xcrun","simctl","list","devicetypes","-j"))["devicetypes"]}
          def pick(*names):
              for n in names:
                  if n in types: return n, types[n]
              raise SystemExit(f"нет типа устройства из {names}; есть: {sorted(types)}")
          out = {}
          for key, names in {
              "iphone": ("iPhone 17 Pro Max", "iPhone 16 Pro Max"),
              "ipad": ("iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)"),
          }.items():
              n, ident = pick(*names)
              udid = sh("xcrun","simctl","create", f"shots-{key}", ident, rt).strip()
              out[key] = udid
              import sys; print(f"{key}: {n} {rt}", file=sys.stderr)
          for k, v in out.items(): print(f"{k}={v}")
          PY

      - name: Shoot iPhone
        run: bash .github/scripts/ios-shots-run.sh "${{ steps.sims.outputs.iphone }}" iphone
      - name: Shoot iPad
        run: bash .github/scripts/ios-shots-run.sh "${{ steps.sims.outputs.ipad }}" ipad

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-screenshots
          path: shots/
          if-no-files-found: warn
